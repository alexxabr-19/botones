<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Botones </title>
    <link rel="stylesheet" href="./libreria.css">
</head>

<body>
    <header>
        <h1> Librería de los 100 botones </h1>
    </header>

    <main>
        <section>
            <h2> 1. Fundamentos y colores — básico </h2>
            <button type="button" class="btn btn-primary"> Primario </button>
            <button type="button" class="btn btn-secondary"> Secundario </button>
            <button type="button" class="btn btn-success"> Éxito </button>
            <button type="button" class="btn btn-danger"> Peligro </button>
            <button type="button" class="btn btn-warning"> Advertencia </button>
            <button type="button" class="btn btn-info"> Información </button>
            <button type="button" class="btn btn-dark"> Oscuro </button>
            <button type="button" class="btn btn-light"> Claro </button>
            <button type="button" class="btn btn-text"> Texto </button>
            <button type="button" class="btn btn-custom"> Personalizado </button>
        </section>

        <section>
            <h2> 2. Border, tamaños y formas </h2>
            <button type="button" class="btn btn-outline"> Contorno </button>
            <button type="button" class="btn btn-border-thick"> Borde grueso </button>
            <button type="button" class="btn btn-border-dashed"> Borde discontinuo </button>
            <button type="button" class="btn btn-border-dotted"> Borde puntuado </button>
            <button type="button" class="btn btn-rounded"> Esquinas redondeadas </button>
            <button type="button" class="btn btn-pill"> Píldora </button>
            <button type="button" class="btn btn-circle"> Circular </button>
            <button type="button" class="btn btn-small"> Pequeño </button>
            <button type="button" class="btn btn-large"> Grande </button>
            <button type="button" class="btn btn-full"> Ancho completo </button>
        </section>

        <section>
            <h2> 3. Tipografía y sombras — básico a intermedio </h2>
            <button type="button" class="btn btn-uppercase"> Mayúsculas </button>
            <button type="button" class="btn btn-spaced"> Espaciado </button>
            <button type="button" class="btn btn-bold"> Negrita </button>
            <button type="button" class="btn btn-elegant"> Elegante </button>
            <button type="button" class="btn btn-underline"> Subrayado </button>
            <button type="button" class="btn btn-shadow-soft"> Sombra suave </button>
            <button type="button" class="btn btn-shadow-strong"> Sombra pronunciada </button>
            <button type="button" class="btn btn-shadow-color"> Sombra de color </button>
            <button type="button" class="btn btn-relief"> Relieve </button>
            <button type="button" class="btn btn-text-glow"> Texto brillante </button>
        </section>

        <section>
            <h2> 4. Degradados — intermedio </h2>
            <button type="button" class="btn btn-gradient-horizontal"> Horizontal </button>
            <button type="button" class="btn btn-gradient-vertical"> Vertical </button>
            <button type="button" class="btn btn-gradient-diagonal"> Diagonal </button>
            <button type="button" class="btn btn-gradient-three"> Elegante </button>
            <button type="button" class="btn btn-gradient-radial"> Subrayado </button>
            <button type="button" class="btn btn-gradient-sunset"> Atardecer </button>
            <button type="button" class="btn btn-gradient-ocean"> Océano </button>
            <button type="button" class="btn btn-gradient-pastel">  Pastel </button>
            <button type="button" class="btn btn-gradient-border"> Border degradado </button>
            <button type="button" class="btn btn-gradient-hover"> Degradado interactivo </button>
        </section>


    </main>

</body>

</html>
